                { category: 'devops', name: 'GitOps & Orchestration', level: 'Expert', desc: 'ArgoCD, Kubernetes, Helm, Kustomize, FluxCD' },
                { category: 'devops', name: 'Infrastructure as Code', level: 'Avancé', desc: 'Terraform, CloudFormation, Ansible, Security Scan (Trivy)' },

                }

            const filteredSkills = activeTab === 'all' 
                ? skills 
                : skills.filter(s => s.category === activeTab);

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
